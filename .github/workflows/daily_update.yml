name: Daily IPTV Source Update & Speedtest

on:
  schedule:
    # 避开整点高峰期：UTC 每天 20:17 运行（对应北京时间次日凌晨 04:17）
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sources:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行抓取与测速脚本
        run: python update_sources.py

      - name: 提交并推送更新后的源
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f libre_tv.m3u libre_vod.json tvbox_live.txt tvbox.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 自动更新测速视频源 $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "文件内容无变化，跳过推送"
          fi
